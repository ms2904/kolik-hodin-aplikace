<!--
  OPTIONAL account & sync setup -- see README.md for the full walkthrough.
  1. Create a free project at https://console.firebase.google.com
  2. Enable Authentication -> Email/Password
  3. Enable Firestore Database, and set the security rules from the README
  4. Copy your project's config below, replacing every "YOUR_..." placeholder.
  If you skip this, the app works exactly the same -- fully offline on this
  device -- and the Account section in Settings will just say sync isn't set up.
-->
<script>
  window.FIREBASE_CONFIG = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT_ID.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID",
  };
</script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
</head>
<body>
<div id="root"></div>

<script>
  // Local storage shim -- window.storage is the same abstraction used when this
  // app runs inside a Claude.ai artifact preview, so the app code doesn't need
  // to know or care which environment it's in.
  window.storage = {
    get: async (key) => {
      const v = localStorage.getItem(key);
      if (v === null) throw new Error("not found");
      return { key, value: v, shared: false };
    },
    set: async (key, value) => {
      localStorage.setItem(key, value);
      return { key, value, shared: false };
    },
    delete: async (key) => {
      localStorage.removeItem(key);
      return { key, deleted: true, shared: false };
    },
    list: async (prefix) => {
      const keys = Object.keys(localStorage).filter((k) => !prefix || k.startsWith(prefix));
      return { keys, prefix, shared: false };
    },
  };

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>

<script type="text/babel" data-presets="react" src="app.jsx"></script>
</body>
